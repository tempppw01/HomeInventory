services:
  home-inventory:
    # 默认使用已发布镜像:自托管用户 `docker compose pull && docker compose up -d` 即可。
    # 想固定版本:image 改成 34v0wphix/homeinventory:0.0.8(所有版本见 GitHub Releases)。
    # 想从源码构建:docker compose up -d --build(下面的 build 段就是为此保留的)。
    image: ${HOME_INVENTORY_IMAGE:-34v0wphix/homeinventory:latest}
    build:
      context: .
    container_name: home-inventory
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/app/data/home-inventory.db
      IMAGE_STORAGE_MODE: ${IMAGE_STORAGE_MODE:-}
      LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-/app/data/uploads}
      # 自动备份的存放目录;留空则放在上传目录下的 backups/。
      # 想把备份放到另一块盘,就把这里指过去。
      BACKUP_DIR: ${BACKUP_DIR:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_DIRECTORY: ${OSS_DIRECTORY:-home-inventory}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - home_inventory_data:/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: home-inventory-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    depends_on:
      - home-inventory
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  home_inventory_data:
