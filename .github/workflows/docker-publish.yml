name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: 34v0wphix/homeinventory
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Next.js 构建在 QEMU 模拟 arm64 时偶发 SIGILL；Railway 与常见云服务器均使用 amd64。
          # 先保证可重复发布，arm64 镜像将在原生 ARM runner 引入后恢复。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout:发布说明来自仓库里的 .github/release-notes/<tag>.md,
      # 没有这一步工作区是空的,文件判断永远为假(踩过:v0.0.8 发出去只有 Full Changelog)。
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 优先用仓库里的发布说明(.github/release-notes/<tag>.md):
          # --generate-notes 只会列出提交标题,读起来像工作日志,不适合当发布说明。
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "使用发布说明:$NOTES_FILE"
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "HomeInventory ${GITHUB_REF_NAME}" --notes-file "$NOTES_FILE"
          else
            echo "没有找到 $NOTES_FILE,退回自动生成说明"
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "HomeInventory ${GITHUB_REF_NAME}" --generate-notes
          fi
