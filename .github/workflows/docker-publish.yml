name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: 34v0wphix/homeinventory

jobs:
  # 两个架构各自在**原生** runner 上构建,再合并成一个多架构清单。
  # 之前用 QEMU 模拟构建 arm64 时偶发 SIGILL,所以只发 amd64;
  # 公开仓库现在可以免费用 GitHub 的原生 arm64 runner(ubuntu-24.04-arm),不再需要模拟。
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # 先按 digest 推送单架构镜像;合并作业再把它们拼成多架构清单。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      # 冒烟脚本在仓库里,需要先 checkout
      - uses: actions/checkout@v5
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # 冒烟测试:把刚推送的镜像真正跑起来。
      # 之前只验证「构建成功、清单里有几个架构」,但没人验证过它能不能启动 ——
      # 发布产物是否可用,应该由 CI 回答,而不是等用户 docker run 才发现。
      - name: Smoke test published image
        run: |
          set -e
          TAG="${{ steps.meta.outputs.version }}"
          docker run -d --name smoke -p 3199:3000 "${{ env.IMAGE }}:$TAG"
          echo '--- 容器日志 ---'
          docker logs smoke 2>&1 | tail -20 || true
          # 不只查健康:初始化管理员 → 登录 → 建物品 → 读回来,证明这个镜像是真能用的。
          node scripts/smoke-test-image.mjs --base http://127.0.0.1:3199 --user smoke --pass "Smoke#2026x"
          docker rm -f smoke > /dev/null 2>&1 || true
          echo "冒烟测试通过:${{ env.IMAGE }}:$TAG 可以启动并完成一次完整的读写"

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          echo "--- 校验两个架构都在清单里 ---"
          docker buildx imagetools inspect --raw ${{ env.IMAGE }}:${{ steps.meta.outputs.version }} \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const m=JSON.parse(d).manifests||[];const arch=m.map(x=>x.platform&&x.platform.architecture).filter(Boolean);console.log('architectures:',arch.join(', '));if(!arch.includes('amd64')||!arch.includes('arm64'))process.exit(1)})"

  # arm64 不能只验证「构建成功」:用原生 ARM runner 拉多架构清单并跑起来,
  # 才能真正确认 ARM 变体在运行时可用的(这正是之前 QEMU 方案翻车的地方)。
  smoke-arm64:
    name: smoke test arm64
    runs-on: ubuntu-24.04-arm
    needs: merge
    steps:
      # 冒烟脚本在仓库里,需要先 checkout
      - uses: actions/checkout@v5
      - name: Pull multi-arch image and run
        run: |
          set -e
          TAG="${{ needs.merge.outputs.version }}"
          if [ -z "$TAG" ]; then echo "拿不到标签版本,使用 latest"; TAG=latest; fi
          echo "runner 架构:$(uname -m)"
          docker run -d --name smoke-arm -p 3198:3000 "${{ env.IMAGE }}:$TAG"
          echo '--- 容器日志 ---'
          docker logs smoke-arm 2>&1 | tail -20 || true
          node scripts/smoke-test-image.mjs --base http://127.0.0.1:3198 --user smoke --pass "Smoke#2026x"
          docker rm -f smoke-arm > /dev/null 2>&1 || true
          echo "arm64 冒烟测试通过(原生 ARM 上完成一次完整读写)"

  release:
    needs: [merge, smoke-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout:发布说明来自仓库里的 .github/release-notes/<tag>.md,
      # 没有这一步工作区是空的,文件判断永远为假(踩过:v0.0.8 发出去只有 Full Changelog)。
      - uses: actions/checkout@v5
      # 发布前先确认**这个 tag 的 CI 是绿的**。
      # 由来:v0.1.65 与 v0.1.66 的 Release 都发出去了,而它们的 CI 是红的
      # (docker-publish 与 ci.yml 是两个工作流,发布作业只等镜像构建,不等 CI)。
      # 用户看到「有新版本」就会去升级,所以「绿了才发」比「快发」重要。
      - name: 等 CI 对这个提交通过(红了就不发 Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${GITHUB_SHA}"
          echo "检查提交 $SHA 的 CI 结果"
          # 60 次 × 10 秒只有 10 分钟,而 CI 全套要 17 分钟上下 —— 第一次就等超时了。放宽到 30 分钟。
          for i in $(seq 1 180); do
            LINE=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow CI --commit "$SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "")
            case "$LINE" in
              "completed success") echo "CI 已通过"; exit 0 ;;
              completed*)
                echo "CI 没通过:$LINE —— 不发 Release,先修 CI"
                exit 1 ;;
              "") echo "还没找到这个提交的 CI 运行,10 秒后重试($i/180)"; sleep 10 ;;
              *) echo "CI $LINE,10 秒后重试($i/180)"; sleep 10 ;;
            esac
          done
          echo "等了 30 分钟还没等到 CI 结果,不发 Release"
          exit 1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 优先用仓库里的发布说明(.github/release-notes/<tag>.md):
          # --generate-notes 只会列出提交标题,读起来像工作日志,不适合当发布说明。
          #
          # 这里必须**可重复执行**:release 已经存在时(有人手动发过,或者这个作业被重跑)
          # gh release create 会以 HTTP 422 Release.tag_name already exists 失败,
          # 而前面几 arm 的镜像其实已经构建、推送、冒烟通过了 —— 一条重复的发布记录
          # 不该让整个 tag 构建变红。已存在就只更新说明,并保留原来的标题。
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} 已存在,只更新说明"
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file "$NOTES_FILE"
            else
              echo "没有 $NOTES_FILE,保留现有说明不动"
            fi
          elif [ -f "$NOTES_FILE" ]; then
            echo "使用发布说明:$NOTES_FILE"
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "HomeInventory ${GITHUB_REF_NAME}" --notes-file "$NOTES_FILE"
          else
            echo "没有找到 $NOTES_FILE,退回自动生成说明"
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "HomeInventory ${GITHUB_REF_NAME}" --generate-notes
          fi

      # 自托管用户最需要的就是这两份 compose;每次发布自动带上,省得手动传。
      - name: Attach deployment files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" docker-compose.yml docker-compose.mysql.yml --clobber
