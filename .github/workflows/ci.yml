name: CI

# 每次 push / PR 跑四组检查(static / unit / api / ui):
# 类型、lint、纯函数单测、API 契约、权限矩阵、备份回环。
# 浏览器套件(verify-experience / verify-entry-fixes / scale)需要 Playwright 与
# 真实服务,放手动或 nightly —— 它们跑一次要几分钟,不适合每次提交都跑。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: 类型与 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run typecheck
      - run: npx eslint src scripts
      # 下面几条都是纯静态检查:秒级、不需要起服务、不占浏览器
      - name: CI 工作流自检
        run: node scripts/verify-ci-workflow.mjs
      - name: 写接口守卫检查
        run: node scripts/verify-api-guards.mjs
      - name: 配置文档一致性检查
        run: node scripts/verify-config-docs.mjs
      - name: 两份 schema 同步检查
        run: node scripts/verify-schema-sync.mjs
      # 镜像里的启动脚本不许引用镜像里没有的东西(v0.1.41 那次事故:@/ 别名让容器起不来)
      - name: 镜像资源边界检查(启动脚本的依赖必须都在镜像里)
        run: node scripts/verify-image-assets.mjs
      # 覆盖地图是「哪些行为有断言」的唯一索引,它说假话比没有更糟(本轮就量到两处漂移)
      - name: 覆盖地图一致性(套件都在表里 / 无幽灵行 / 单测条数与实际一致)
        run: node scripts/verify-coverage-map.mjs
      - name: MySQL schema 合法性校验
        env:
          DATABASE_URL: mysql://user:pass@localhost:3306/db
        run: npx prisma validate --schema prisma/schema.mysql.prisma

  unit:
    name: 纯函数单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  api:
    name: API 契约 / 权限 / 备份回环 / 极端输入
    runs-on: ubuntu-latest
    needs: static
    env:
      DATABASE_URL: file:../data/ci.db
      # 图片上传默认写本地目录;CI 里默认路径(/app/data/uploads)不可写,所以显式指定
      LOCAL_UPLOAD_DIR: ${{ github.workspace }}/data/uploads
      PROBE_USER: bgs
      PROBE_PASS: Ci#Bootstrap2026
      BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run build
      - name: 初始化数据库与管理员账号
        run: |
          mkdir -p data
          npx prisma db push --schema prisma/schema.prisma --skip-generate
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const { randomBytes, scryptSync } = require('node:crypto');
            const salt = randomBytes(16).toString('hex');
            const hash = salt + ':' + scryptSync(process.env.PROBE_PASS, salt, 64).toString('hex');
            (async () => {
              const prisma = new PrismaClient();
              await prisma.user.create({ data: { username: process.env.PROBE_USER, displayName: 'CI', passwordHash: hash, role: 'ADMIN' } });
              await prisma.\$disconnect();
            })();
          "
      - name: 启动服务
        run: |
          PORT=3001 node node_modules/next/dist/bin/next start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then echo "ready"; break; fi
            sleep 2
          done
      - run: node scripts/api-contract-test.mjs
      - run: node scripts/auth-matrix-test.mjs
      - run: node scripts/backup-roundtrip-test.mjs
      - run: node scripts/edge-input-test.mjs
      - name: 账号管理写操作核对
        run: node scripts/verify-account-ops.mjs
      - name: 账号自助改密码(/api/auth/password,含只读账号与其它会话吊销)
        run: node scripts/verify-account-self-service.mjs
      # 权限矩阵需要「只读」和「成员」两个真实账号;upsert,可重复执行。
      - name: 准备权限矩阵用的探针账号(只读 / 成员)
        run: node scripts/make-probe-accounts.mjs
      - name: 写接口权限矩阵(只读拦得住、成员不被误伤、设置只给管理员)
        run: node scripts/verify-write-guards.mjs
      - name: 备份往返日期核对
        run: node scripts/verify-backup-dates.mjs
      - name: 搜索历史与自动备份检查
        run: node scripts/verify-search-history-and-backup.mjs
      # 升级演练需要旧版本的 schema(从 git 历史里取),而 CI 默认是浅克隆。
      # 取不到时脚本会明确跳过并打印原因,不会伪装成通过。
      - name: 取回历史标签(升级演练用)
        run: git fetch --depth 1 origin tag v0.0.7 || true
      - name: 跨版本升级演练
        run: node scripts/verify-upgrade-path.mjs
      # 迁移脚本会改写用户数据、只在升级路径上跑,平时没人碰 —— 此前完全没有回归。
      # 实测就抓到:backfill 的编号日期取的是 UTC 日,与在线路径的本地日不一致。
      - name: 迁移脚本检查(编号回填用本地日 / 幂等 / normalize 只动耐用品)
        run: node scripts/verify-migrations.mjs
      # 完整备份的覆盖面与体积:导出会随数据增长,恢复必须能吃得下(默认 proxy 上限只有 10 MB)
      - name: 完整备份的覆盖面与体积(≥10MB 也要能恢复 / 任务·盘点·偏好都在备份里)
        run: node scripts/verify-backup-scope.mjs
      # 每日自动备份:与手动导出同构(此前漂成 version 1、少任务/盘点/偏好)、保留策略、状态可查
      - name: 自动备份检查(负载同构 / 保留最近 N 份 / 状态接口)
        run: node scripts/verify-auto-backup.mjs
      # 采购闭环:标记「已购买」只该入库一次,撤销要退回(修之前 10 → 13 → 16 → 19)
      - name: 采购闭环检查(只入一次库 / 撤销退回 / 记账在采购项上)
        run: node scripts/verify-shopping-purchase.mjs
      # 老备份里的坏行必须被报出来(实测:4 行只剩 1 行,响应却只说恢复了 1 件)
      - name: 恢复报告检查(跳过的行要给出总数 / 行号 / 中文原因)
        run: node scripts/verify-restore-report.mjs
      - name: 图片上传检查(本地存储)
        run: node scripts/verify-image-upload.mjs
      - name: 家庭成员与系统信息检查
        run: node scripts/verify-members-and-sysinfo.mjs
      - name: 导入接口检查
        run: node scripts/verify-import.mjs
      - name: 首屏载荷预算(gzip / 单件体积 / 导出契约)
        run: node scripts/verify-payload-budget.mjs
      - name: 跨用户数据隔离检查
        run: node scripts/verify-user-isolation.mjs
      - name: 并发行为检查
        run: node scripts/verify-concurrency.mjs
      - name: 补货暂停行为检查
        run: node scripts/verify-restock-pause.mjs
      - name: 任务周期核对(读库确认)
        run: node scripts/verify-task-recurrence.mjs

      - name: 失败时打印服务日志
        if: failure()
        run: tail -100 server.log

  # 界面检查单独成作业:与 api 作业并行跑,总时长从 11+ 分钟回到 ~6 分钟。
  # 代价是重复一次 npm ci / build / 起服务 —— 换来的是反馈更快。
  ui-layout:
    name: 界面检查·布局(月报 / 窄屏 / 布局预算)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: static
    env:
      # 这套检查必须有真实浏览器:装不上就该失败,而不是跳过之后显示「通过」
      REQUIRE_BROWSER: "1"
      DATABASE_URL: file:../data/ci.db
      PROBE_USER: bgs
      PROBE_PASS: Ci#Bootstrap2026
      BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      # 浏览器缓存:省时间,也减少对 Playwright CDN 的依赖次数
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # GitHub 的 ubuntu runner 自带 Google Chrome。直接用它可以把
      # 「下载浏览器 + apt 装依赖」这 ~4 分钟的步骤整个省掉;
      # 没有系统 Chrome 时才回退到 Playwright 自带的 Chromium(CDN 偶发失败,重试一次)。
      - name: 准备浏览器
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "使用系统 Chrome:/usr/bin/google-chrome"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            echo "系统没有 Chrome,安装 Playwright Chromium"
            npx playwright install --with-deps chromium || (sleep 10 && npx playwright install --with-deps chromium)
          fi
      # runner 默认没有中文字体,缺字时文字渲染成方块、行数与宽度都会失真。
      #
      # 这里不用 apt:实测 `apt-get install fonts-noto-cjk` 会偶发卡住(某次卡了 20 分钟
      # 把整个作业拖死)。改成直接下载一个字体文件 + fc-cache,并缓存下载结果;
      # 再给步骤加超时,卡住就快速失败而不是挂着。
      - name: 缓存中文字体
        uses: actions/cache@v4
        with:
          # 放到 fontconfig 默认就会扫描的目录,自定义目录需要额外写配置
          path: ~/.local/share/fonts
          key: noto-sans-sc-v2
      - name: 安装中文字体(排版测量需要)
        timeout-minutes: 5
        run: |
          mkdir -p ~/.local/share/fonts
          if [ ! -s ~/.local/share/fonts/NotoSansSC-Regular.otf ]; then
            curl -fsSL --max-time 120 --retry 2 -o ~/.local/share/fonts/NotoSansSC-Regular.otf \
              https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          fi
          fc-cache -f > /dev/null
          count=$(fc-list 2>/dev/null | grep -ci "noto sans" || true)
          echo "检测到 Noto 字体数:$count"
          fc-list 2>/dev/null | grep -i "noto sans" | head -3 || true
          test "$count" -ge 1
      - run: npm run build
      - name: 初始化数据库与账号
        run: |
          mkdir -p data
          npx prisma db push --schema prisma/schema.prisma --skip-generate
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const { randomBytes, scryptSync } = require('node:crypto');
            const salt = randomBytes(16).toString('hex');
            const hash = salt + ':' + scryptSync(process.env.PROBE_PASS, salt, 64).toString('hex');
            (async () => {
              const prisma = new PrismaClient();
              await prisma.user.create({ data: { username: process.env.PROBE_USER, displayName: 'CI', passwordHash: hash, role: 'ADMIN' } });
              await prisma.\$disconnect();
            })();
          "
          node scripts/make-probe-accounts.mjs
      - name: 启动服务
        run: |
          PORT=3001 node node_modules/next/dist/bin/next start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then echo "ready"; break; fi
            sleep 2
          done
      # 月报图表依赖消费记录:空库下页面没问题,但「图表必须渲染」的断言就失去意义。
      - name: 播种界面检查数据
        run: node scripts/seed-ci-fixtures.mjs
      - name: 打印月报页检查
        run: node scripts/verify-report-page.mjs
      - name: 窄屏(320px)布局检查
        run: node scripts/verify-narrow-layout.mjs
      - name: 传输体积预算检查
        run: node scripts/verify-bundle-budget.mjs
      # 规模性能:阈值是**相对**的(与本次运行的基线比较),所以可以进 CI ——
      # 耗时的绝对值随机器变化,但「80 件相对小数据集的倍数」是稳定的。
      - name: 规模性能检查(相对基线)
        env:
          SCALE_TARGET: 80
        run: node scripts/scale-perf-test.mjs
      - name: 布局预算检查(阅读区占比)
        run: node scripts/verify-layout-budget.mjs
      - name: 失败时打印服务日志
        if: failure()
        run: tail -100 server.log

  ui-a11y:
    name: 界面检查·无障碍(键盘 / 弹窗 / 菜单 / 对比度)
