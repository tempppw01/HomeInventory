    runs-on: ubuntu-latest
    needs: static
    env:
      # 这套检查必须有真实浏览器:装不上就该失败,而不是跳过之后显示「通过」
      REQUIRE_BROWSER: "1"
      DATABASE_URL: file:../data/ci.db
      PROBE_USER: bgs
      PROBE_PASS: Ci#Bootstrap2026
      BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      # 浏览器缓存:省时间,也减少对 Playwright CDN 的依赖次数
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # GitHub 的 ubuntu runner 自带 Google Chrome。直接用它可以把
      # 「下载浏览器 + apt 装依赖」这 ~4 分钟的步骤整个省掉;
      # 没有系统 Chrome 时才回退到 Playwright 自带的 Chromium(CDN 偶发失败,重试一次)。
      - name: 准备浏览器
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "使用系统 Chrome:/usr/bin/google-chrome"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            echo "系统没有 Chrome,安装 Playwright Chromium"
            npx playwright install --with-deps chromium || (sleep 10 && npx playwright install --with-deps chromium)
          fi
      # runner 默认没有中文字体,缺字时文字渲染成方块、行数与宽度都会失真。
      #
      # 这里不用 apt:实测 `apt-get install fonts-noto-cjk` 会偶发卡住(某次卡了 20 分钟
      # 把整个作业拖死)。改成直接下载一个字体文件 + fc-cache,并缓存下载结果;
      # 再给步骤加超时,卡住就快速失败而不是挂着。
      - name: 缓存中文字体
        uses: actions/cache@v4
        with:
          # 放到 fontconfig 默认就会扫描的目录,自定义目录需要额外写配置
          path: ~/.local/share/fonts
          key: noto-sans-sc-v2
      - name: 安装中文字体(排版测量需要)
        timeout-minutes: 5
        run: |
          mkdir -p ~/.local/share/fonts
          if [ ! -s ~/.local/share/fonts/NotoSansSC-Regular.otf ]; then
            curl -fsSL --max-time 120 --retry 2 -o ~/.local/share/fonts/NotoSansSC-Regular.otf \
              https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          fi
          fc-cache -f > /dev/null
          count=$(fc-list 2>/dev/null | grep -ci "noto sans" || true)
          echo "检测到 Noto 字体数:$count"
          fc-list 2>/dev/null | grep -i "noto sans" | head -3 || true
          test "$count" -ge 1
      - run: npm run build
      - name: 初始化数据库与账号
        run: |
          mkdir -p data
          npx prisma db push --schema prisma/schema.prisma --skip-generate
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const { randomBytes, scryptSync } = require('node:crypto');
            const salt = randomBytes(16).toString('hex');
            const hash = salt + ':' + scryptSync(process.env.PROBE_PASS, salt, 64).toString('hex');
            (async () => {
              const prisma = new PrismaClient();
              await prisma.user.create({ data: { username: process.env.PROBE_USER, displayName: 'CI', passwordHash: hash, role: 'ADMIN' } });
              await prisma.\$disconnect();
            })();
          "
          node scripts/make-probe-accounts.mjs
      - name: 启动服务
        run: |
          PORT=3001 node node_modules/next/dist/bin/next start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then echo "ready"; break; fi
            sleep 2
          done
      # 月报图表依赖消费记录:空库下页面没问题,但「图表必须渲染」的断言就失去意义。
      - name: 播种界面检查数据
        run: node scripts/seed-ci-fixtures.mjs
      - name: 键盘无障碍检查
        run: node scripts/verify-a11y.mjs
      - name: 弹窗无障碍检查
        run: node scripts/verify-modals-a11y.mjs
      - name: 嵌套控件检查(控件套控件会触发 hydration 错误,并让内层按钮连带触发整行)
        run: node scripts/verify-nested-controls.mjs
      - name: axe 体系化无障碍扫描(11 个页面 × 亮/暗主题 × 桌面/窄屏)
        run: node scripts/verify-axe.mjs
      # 需要配置了 AI 才有草稿,未配置时脚本会打印跳过(不判红)。
      - name: AI 批量识别草稿列表检查
        run: node scripts/verify-batch-drafts.mjs
      - name: 日期选择器键盘检查
        run: node scripts/verify-date-picker.mjs
      - name: 菜单无障碍检查
        run: node scripts/verify-menus-a11y.mjs
      - name: 颜色对比度检查(明暗两套主题 + 只读角色视角)
        env:
          PROBE_VIEWER_PASS: View#2026
        run: node scripts/verify-contrast.mjs
      - name: 失败时打印服务日志
        if: failure()
        run: tail -100 server.log

  # MySQL 运行时检查:真在 MySQL 上起服务,跑 api 契约与迁移脚本。
  # 这条路径(compose + schema.mysql.prisma + DATABASE_PROVIDER=mysql)此前只有静态 schema 比对,
  # 从没真跑过 —— 而 prisma.ts 曾把 SQLite 的连接池参数套到 MySQL 上(v0.1.46 已改成只对 file: 生效)。
  mysql-runtime:
    name: MySQL 运行时检查(契约 + 迁移脚本)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: static
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: homeinventory
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://root:rootpw@127.0.0.1:3306/homeinventory
      PROBE_USER: leadcheck
      PROBE_PASS: Lead#2026
      BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 用 MySQL 版 schema 生成客户端并建表
        run: |
          npx prisma generate --schema prisma/schema.mysql.prisma
          npx prisma db push --schema prisma/schema.mysql.prisma --skip-generate
      - run: npm run build
      # 用仓库里已有的建号脚本 —— 别再写内联 node -e:上次那句 $disconnect 被 shell 展开成了 prisma.()
      - name: 初始化账号(MySQL 上是空库)
        run: node scripts/make-probe-accounts.mjs
      - name: 启动服务
        run: |
          PORT=3001 node node_modules/next/dist/bin/next start > server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then echo ready; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3001/api/health
      - name: API 契约(在 MySQL 上)
        run: node scripts/api-contract-test.mjs
      - name: 迁移脚本(在 MySQL 上:编号回填用本地创建日 / 幂等 / normalize 只动耐用品)
        run: node scripts/verify-migrations.mjs
      - name: 失败时打印服务日志
        if: failure()
        run: tail -100 server.log

  ui-flows:
    name: 界面检查·流程(体验 / 录入修复 / P2)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: static
    env:
      # 这套检查必须有真实浏览器:装不上就该失败,而不是跳过之后显示「通过」
      REQUIRE_BROWSER: "1"
      DATABASE_URL: file:../data/ci.db
      PROBE_USER: bgs
      PROBE_PASS: Ci#Bootstrap2026
      BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      # 浏览器缓存:省时间,也减少对 Playwright CDN 的依赖次数
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # GitHub 的 ubuntu runner 自带 Google Chrome。直接用它可以把
      # 「下载浏览器 + apt 装依赖」这 ~4 分钟的步骤整个省掉;
      # 没有系统 Chrome 时才回退到 Playwright 自带的 Chromium(CDN 偶发失败,重试一次)。
      - name: 准备浏览器
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "使用系统 Chrome:/usr/bin/google-chrome"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            echo "系统没有 Chrome,安装 Playwright Chromium"
            npx playwright install --with-deps chromium || (sleep 10 && npx playwright install --with-deps chromium)
          fi
      # runner 默认没有中文字体,缺字时文字渲染成方块、行数与宽度都会失真。
      #
      # 这里不用 apt:实测 `apt-get install fonts-noto-cjk` 会偶发卡住(某次卡了 20 分钟
      # 把整个作业拖死)。改成直接下载一个字体文件 + fc-cache,并缓存下载结果;
      # 再给步骤加超时,卡住就快速失败而不是挂着。
      - name: 缓存中文字体
        uses: actions/cache@v4
        with:
          # 放到 fontconfig 默认就会扫描的目录,自定义目录需要额外写配置
          path: ~/.local/share/fonts
          key: noto-sans-sc-v2
      - name: 安装中文字体(排版测量需要)
        timeout-minutes: 5
        run: |
          mkdir -p ~/.local/share/fonts
          if [ ! -s ~/.local/share/fonts/NotoSansSC-Regular.otf ]; then
            curl -fsSL --max-time 120 --retry 2 -o ~/.local/share/fonts/NotoSansSC-Regular.otf \
              https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          fi
          fc-cache -f > /dev/null
          count=$(fc-list 2>/dev/null | grep -ci "noto sans" || true)
          echo "检测到 Noto 字体数:$count"
          fc-list 2>/dev/null | grep -i "noto sans" | head -3 || true
          test "$count" -ge 1
      - run: npm run build
      - name: 初始化数据库与账号
        run: |
          mkdir -p data
          npx prisma db push --schema prisma/schema.prisma --skip-generate
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const { randomBytes, scryptSync } = require('node:crypto');
            const salt = randomBytes(16).toString('hex');
            const hash = salt + ':' + scryptSync(process.env.PROBE_PASS, salt, 64).toString('hex');
            (async () => {
              const prisma = new PrismaClient();
              await prisma.user.create({ data: { username: process.env.PROBE_USER, displayName: 'CI', passwordHash: hash, role: 'ADMIN' } });
              await prisma.\$disconnect();
            })();
          "
          node scripts/make-probe-accounts.mjs
      - name: 启动服务
        run: |
          PORT=3001 node node_modules/next/dist/bin/next start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then echo "ready"; break; fi
            sleep 2
          done
      # 月报图表依赖消费记录:空库下页面没问题,但「图表必须渲染」的断言就失去意义。
      - name: 播种界面检查数据
        run: node scripts/seed-ci-fixtures.mjs
      - name: 界面体验检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
          PROBE_VIEWER_PASS: View#2026
        run: node scripts/verify-experience.mjs
      - name: 物品模板检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-item-template.mjs
      - name: 物品详情页检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-item-detail.mjs
      - name: 物品合并检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-item-merge.mjs
      - name: 暂停补货提醒入口检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-restock-pause-ui.mjs
      - name: 每周盘点提醒检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-weekly-review.mjs
      - name: 空状态检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-empty-states.mjs
      - name: 首次使用检查(欢迎引导的三个入口 / 焦点陷阱 / 看过之后不再打扰)
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-first-run.mjs
      - name: 离线行为检查(Service Worker)
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-offline.mjs
      - name: 角色界面检查(成员看不到管理员专属设置)
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-role-ui.mjs
      - name: 只读界面检查(写入口缺席或置灰)
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
          PROBE_VIEWER_PASS: View#2026
        run: node scripts/verify-readonly-ui.mjs
      - name: 登录门禁检查(未登录不该看到数据)
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-auth-gate.mjs
      - name: 扫码消耗页检查(/consume)
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-consume-scan.mjs
      - name: 扫码识别检查(图片模式,不需要摄像头)
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-qr-scan.mjs
      - name: 打印排版检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-print-layout.mjs
      - name: 关于页与版本一致性检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-about-and-version.mjs
      - name: 概览首屏卡片检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-overview-focus.mjs
      - name: 物品卡片布局检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-item-card-layout.mjs
      - name: 盘点确认推进检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-audit-confirm-flow.mjs
      - name: 录入与交互修复检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
          PROBE_VIEWER_PASS: View#2026
        run: node scripts/verify-entry-fixes.mjs
      # P2 功能检查(详情页变更记录 / CSV 导出 / 批量改数量 / 到期日历 / SW 注册):
      # 自带探针数据,结束时自行清理。
      - name: P2 功能检查
        env:
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-p2-features.mjs
      # 空库上的「新用户从 0 到 1」旅程:上面几十个套件全都跑在有数据的库上,
      # 空状态与首次使用只会在空库上暴露。这里另起一个空库实例(3002),
      # **不动 3001 那份共享数据** —— 这条检查会把物品清空。
      - name: 准备空库与账号(首次使用旅程用)
        run: |
          DATABASE_URL="file:../data/empty.db" npx prisma db push --schema prisma/schema.prisma --skip-generate
          DATABASE_URL="file:../data/empty.db" node scripts/make-probe-accounts.mjs
      - name: 启动空库实例(3002)
        run: |
          DATABASE_URL="file:../data/empty.db" PORT=3002 node node_modules/next/dist/bin/next start > server-empty.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/api/health > /dev/null; then echo "ready"; break; fi
            sleep 2
          done
      - name: 首次使用旅程检查(空库:引导 → 录入第一件物品 → 首屏从空切到有)
        env:
          BASE_URL: http://127.0.0.1:3002
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-first-run-journey.mjs
      # 换机迁移:把 3001 的完整备份恢复进**空库实例**(3002),核对一件不少。
      # 此前恢复端的去重按「名称+位置」判重复 —— 空库上同名物品会被丢掉大半,实测 333 件只进 23 件。
      - name: 换机迁移检查(备份恢复进空库实例:物品一件不少 / 重复恢复幂等)
        env:
          SOURCE_URL: http://127.0.0.1:3001
          TARGET_URL: http://127.0.0.1:3002
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-backup-migration.mjs
      # 「库结构比应用旧」的失败体验:自建部署最常见的升级失误 ——
      # 换了镜像却没同步库结构。这里由 ci.db 复制出 old.db 并删掉两列来模拟。
      - name: 准备「结构比应用旧」的库(复制 ci.db 后删两列)
        run: |
          cp data/ci.db data/old.db
          node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync('data/old.db');
            for (const col of ['consumeRate', 'storage']) db.exec('ALTER TABLE Item DROP COLUMN ' + col);
            db.close();
            console.log('old.db 已就绪');
          "
      - name: 启动「结构旧」实例(3004)
        run: |
          DATABASE_URL="file:../data/old.db" PORT=3004 node node_modules/next/dist/bin/next start > server-old.log 2>&1 &
          for i in $(seq 1 30); do
            # 注意:这个实例的 /api/health 本来就该回 503,不能用 curl -fsS 等
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:3004/api/health || true)
            if [ "$code" = "503" ] || [ "$code" = "200" ]; then echo "ready ($code)"; break; fi
            sleep 2
          done
      - name: 升级失败体验检查(结构比应用旧:health 如实、接口给命令、页面不崩)
        env:
          BASE_URL: http://127.0.0.1:3001
          BASE_OLD_URL: http://127.0.0.1:3004
          PROBE_USER: leadcheck
          PROBE_PASS: Lead#2026
        run: node scripts/verify-schema-outdated.mjs
      - name: 失败时打印服务日志
        if: failure()
        run: tail -100 server.log
